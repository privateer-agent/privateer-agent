name: release

# Build the self-contained per-platform bundles and attach them to the GitHub
# Release. The installers (privateer.pro/install.sh, install.ps1) download these,
# so a user needs neither Node nor npm.
#
# Cross-building: `npm ci --os/--cpu` fetches each target's os/cpu-gated optional
# deps, and koffi/pi-tui ship all platforms in one package — so every target builds
# correctly on one Ubuntu runner. We still smoke-test on the real OS (Linux inline,
# Windows in a dedicated job) before publishing.
#
# Trigger: push a tag like v0.5.2 (or run by hand for a build-only dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # required for npm provenance (Sigstore OIDC) — see publish-npm

env:
  NODE_VERSION: "22.19.0"

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create (or reuse) the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag

  build:
    needs: [create-release]
    if: always() # still runs on dry-run (create-release skipped)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, win32-x64]
        # linux-arm64 / win32-arm64 pending. See docs/shipping.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip xz-utils

      - name: Build bundle (${{ matrix.target }})
        run: node scripts/build-bundle.mjs --target ${{ matrix.target }} --node "${NODE_VERSION}"

      - name: Smoke test (Linux only — the only target this runner can execute)
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "dist-bundle/privateer-${{ matrix.target }}.tar.gz" -C "$work"
          app="$work/privateer-${{ matrix.target }}"
          home="$work/home"; mkdir -p "$home"
          out="$(env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$home" \
                 PRIVATEER_HOME="$home/.privateer" TERM=xterm \
                 bash "$app/bin/privateer-tui" --version 2>&1)"
          echo "boot output: $out"; test -n "$out"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: privateer-${{ matrix.target }}
          path: dist-bundle/privateer-${{ matrix.target }}.*

  # Real Windows verification: download the win bundle artifact, unzip, boot it.
  smoke-windows:
    needs: [build]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: privateer-win32-x64
          path: dl
      - name: Boot the Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path (Get-ChildItem dl\*.zip)[0].FullName -DestinationPath extract -Force
          $app = "extract\privateer-win32-x64"
          $env:PRIVATEER_HOME = "$PWD\pvhome"
          $out = & "$app\bin\privateer.cmd" --version 2>&1 | Out-String
          Write-Host "boot output: $out"
          if (-not $out.Trim()) { throw "empty output — bundle failed to boot" }

      # The harbor on Windows, actually started.
      #
      # harborSocketPath() returns a \\.\pipe\ name on win32 because listen()
      # there accepts nothing else — and that branch shipped once having never
      # run on a real Windows machine, which is how 0.12.6 went out with a
      # harbor that could not start at all. A unit test can't catch it: the bug
      # lives in the shape of the address the OS is handed, so only a real
      # Windows kernel can say whether it was the right shape.
      #
      # Two processes are the whole point. One runs the harbor; the other asks
      # it for status over the pipe, which is the exact path (client connect +
      # the EADDRINUSE / no-existsSync-precheck handling) that was broken.
      # `publish` needs this job, so a Windows harbor that can't start now stops
      # the release rather than shipping inside it.
      - name: Start a harbor and talk to it over the pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "extract\privateer-win32-x64"
          $env:PRIVATEER_HOME = "$PWD\pvhome"
          $proc = Start-Process -FilePath "$app\bin\privateer.cmd" -ArgumentList 'harbor','run' `
            -PassThru -NoNewWindow -RedirectStandardOutput harbor-out.txt -RedirectStandardError harbor-err.txt
          try {
            $running = $false
            # Cold start on a Windows runner is slow (tsx + the whole agent), so
            # poll rather than sleep-and-hope.
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 4
              if ($proc.HasExited) { break }
              $status = & "$app\bin\privateer.cmd" harbor status 2>&1 | Out-String
              if ($status -match 'harbor:\s+running') { $running = $true; Write-Host $status; break }
            }
            if (-not $running) {
              Write-Host "=== harbor stdout ==="; Get-Content harbor-out.txt -ErrorAction SilentlyContinue
              Write-Host "=== harbor stderr ==="; Get-Content harbor-err.txt -ErrorAction SilentlyContinue
              Write-Host "=== last status ===";   Write-Host $status
              throw "harbor never answered on the named pipe"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

  publish:
    needs: [build, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # An explicit block REPLACES the workflow-level one, so contents: write has to
    # be restated here or `gh release upload` loses its token.
    permissions:
      contents: write # gh release upload / edit
      id-token: write # Sigstore OIDC, for the bundle attestation below
      attestations: write # record the attestation against this repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      # Attest the bundles the way npm attests the tarball.
      #
      # The bundle is the install path we RECOMMEND (curl | sh), and until now it
      # was the least verifiable one: the only integrity signal on a ~100MB
      # download was a .sha256 served from the same origin as the file it
      # describes, so whoever could swap one could swap both. This signs a
      # Sigstore statement binding each bundle's digest to this repo, this commit
      # and this workflow run — checkable offline with
      # `gh attestation verify <file> --repo privateer-agent/privateer-agent`,
      # which install.sh now runs automatically when gh is present.
      #
      # Only the archives are subjects; the .sha256 sidecars are not worth signing
      # (an attested archive makes them redundant).
      - name: Attest the release bundles
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dl/*/privateer-*.tar.gz
            dl/*/privateer-*.zip
      # GH_REPO is load-bearing: this job downloads artifacts but never checks out the
      # repo, so `gh` has no git remote to infer the target from and dies with
      # "fatal: not a git repository". That is why every release from v0.6.2 on ended
      # up with ZERO assets and `releases/latest/download/...` 404'd — the installers
      # at privateer.pro were broken the whole time. Naming the repo explicitly is
      # cheaper than adding a checkout we otherwise don't need.
      - name: Attach all bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dl/*/privateer-*.* --clobber

      # Never let a release be published empty again. The upload above failing is loud,
      # but nothing was watching; this turns "the installers are broken" into a failed
      # release instead of a silent one.
      - name: Verify every bundle is attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for t in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            gh release view "${GITHUB_REF_NAME}" --json assets \
              --jq '.assets[].name' | grep -q "privateer-${t}\." \
              || { echo "missing bundle for ${t}"; exit 1; }
          done
          echo "all bundles attached"

      # Publish the release for real, and mark it Latest. This step exists because
      # DELETING A TAG DEMOTES ITS RELEASE TO A DRAFT — so re-pushing a tag to fix a
      # failed run (as v0.12.5 did) leaves a fully-built release that `releases/latest`
      # refuses to see, since that endpoint skips drafts. create-release's
      # `gh release view || gh release create` can't catch it either: a draft IS
      # viewable, so it reuses the draft and nobody flips it back. The visible symptom
      # is `privateer update` reporting the PREVIOUS version as "the latest release"
      # (install.sh resolves the version off the releases/latest redirect), while npm
      # is correctly on the new one. Idempotent on a normal first-time release.
      - name: Publish the release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = "false"
          # The endpoint the installers actually read must now point at this tag.
          # Retried: the redirect can lag the API by a few seconds.
          for i in 1 2 3 4 5; do
            latest="$(curl -fsI "https://github.com/${GITHUB_REPOSITORY}/releases/latest" \
              | tr -d '\r' | sed -n 's|^[Ll]ocation:.*/tag/||p')"
            [ "$latest" = "${GITHUB_REF_NAME}" ] && break
            echo "releases/latest is '${latest}' (attempt ${i}) — retrying"
            sleep 5
          done
          test "$latest" = "${GITHUB_REF_NAME}" \
            || { echo "releases/latest resolves to '${latest}', expected '${GITHUB_REF_NAME}'"; exit 1; }
          echo "published ${GITHUB_REF_NAME} — releases/latest agrees"

  # Publish a dependency inventory alongside the release.
  #
  # "What am I actually running?" currently requires cloning the repo and reading a
  # lockfile. A CycloneDX SBOM answers it from the release page — and matters more
  # here than for most packages, because a coding agent's dependency tree is its
  # real attack surface and ours is ~500 packages deep. It also means that when an
  # advisory lands against something transitive, anyone can check whether a GIVEN
  # release was affected, without us having to be the ones who say so.
  #
  # Its own job rather than a step inside publish-npm: that job is deliberately
  # contents: read, and it should stay that way.
  sbom:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the release
      id-token: write # Sigstore OIDC, for the attestation below
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ignore-scripts matches .npmrc and the shape we tell users to install with;
      # `npm sbom` reads the resolved tree, and no install hook can change that tree.
      - name: Install (no scripts)
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          out="privateer-agent-${GITHUB_REF_NAME}.cdx.json"
          npm sbom --sbom-format cyclonedx --sbom-type application > "$out"
          # A near-empty SBOM means the tree didn't resolve. Publishing that is worse
          # than publishing none: it reads as "this package has no dependencies".
          # The real tree is ~450 components, so 100 is a floor, not a target.
          n="$(node -p "(require('./' + process.argv[1]).components || []).length" "$out")"
          echo "SBOM lists ${n} components"
          test "${n}" -gt 100 || { echo "SBOM looks truncated (${n} components)"; exit 1; }

      - name: Attest the SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: privateer-agent-${{ github.ref_name }}.cdx.json

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" "privateer-agent-${GITHUB_REF_NAME}.cdx.json" --clobber

  # Publish to npm WITH PROVENANCE. This is the load-bearing trust signal: npm
  # records a signed Sigstore attestation binding the published tarball to this
  # repo, this commit and this workflow run, and the package page then renders a
  # verified "Built and signed on GitHub Actions" badge linking back to the build.
  # Anyone (or any agent) evaluating `npx privateer-agent` can check that the code
  # on npm is the code in the public repo — without trusting a maintainer's laptop.
  #
  # Auth is npm TRUSTED PUBLISHING (OIDC) — there is deliberately NO npm token here,
  # and none should be added. npmjs.com is configured to trust exactly this repo +
  # this workflow file, and the short-lived OIDC credential is minted per run, so
  # there is no long-lived publish secret to leak or rotate.
  #
  # Requirements, all of which must hold or the publish fails / loses provenance:
  #   - id-token: write (granted at workflow level above)
  #   - repository/homepage in package.json resolving to this public repo
  #   - a Trusted Publisher configured on npmjs.com naming THIS workflow filename
  #     (rename this file and publishing breaks until npm is updated to match)
  #   - npm >= 11.5.1 — Node 22.19.0 ships 10.9.x, hence the explicit upgrade below
  publish-npm:
    needs: [build, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing landed in npm 11.5.1, and Node 22.19.0 ships npm 10.9.x —
      # hence the upgrade. Pin to the 11.x line rather than `npm@latest`: npm 12
      # requires node ^22.22.2 || ^24.15.0 || >=26, which our pinned runtime does not
      # satisfy, so `@latest` fails EBADENGINE. NODE_VERSION is the runtime we SHIP in
      # bundles, so it must not be bumped just to satisfy a publish-time tool.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      # Dev deps are needed to typecheck; the published tarball is `files`-scoped
      # regardless. --ignore-scripts proves the package installs without running any
      # (there is no postinstall by design — see bin/apply-patches.mjs).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

      # Verify registry signatures and provenance attestations for the entire
      # installed tree before publishing anything built from it. Catches a
      # registry-side tarball swap that a lockfile integrity hash alone would
      # only catch if the lockfile predates the swap.
      - name: Audit dependency signatures
        run: npm audit signatures

      # The tag must match the version we're about to publish, or a mistagged push
      # publishes something nobody reviewed under that tag's provenance.
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          pkg="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "tag v$tag != package.json $pkg"; exit 1; }

      # No NODE_AUTH_TOKEN: the OIDC exchange supplies credentials. Provenance is
      # implied by trusted publishing; --provenance is kept explicit so a misconfigured
      # run fails loudly rather than quietly publishing an unattested tarball.
      - name: Publish
        run: npm publish --provenance --access public
